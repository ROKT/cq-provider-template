# DO NOT EDIT. This file is synced from https://github.com/cloudquery/.github/.github
name: validate-release
on:
  pull_request:
    branches:
      - main
env:
  CGO_ENABLED: 0

jobs:
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: startsWith(github.head_ref, 'release')
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0
      - name: Set up Go
        if: startsWith(github.head_ref, 'release')
        uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3
        with:
          go-version: 1.18
      - name: Run GoReleaser Dry-Run
        if: startsWith(github.head_ref, 'release')
        uses: goreleaser/goreleaser-action@b508e2e3ef3b19d4e4146d4f8fb3ba9db644a757 # v3
        with:
          version: latest
          args: release --rm-dist --skip-validate --skip-publish --skip-sign